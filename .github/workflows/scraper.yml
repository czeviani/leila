name: Leila Scraper

on:
  schedule:
    # Uma rodada diária às 06h BRT (09h UTC). O catálogo registra a saúde
    # de cada fonte; não duplicar a rodada para compensar falhas parciais.
    - cron: '0 9 * * *'
  workflow_dispatch:
    # Disparo manual via GitHub UI ou API

concurrency:
  group: leila-scraper-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.LEILA_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.LEILA_SUPABASE_SERVICE_KEY }}
          PROXY_ROTATION: 'true'
          PROXY_LIST: ${{ secrets.LEILA_PROXY_LIST }}
          SCRAPER_UFS: 'SP'
          SCRAPER_TARGET_STATE: 'SP'
          SCRAPER_TARGET_CITY: 'São Paulo'
          ZUK_READER_BASE_URL: ${{ vars.LEILA_ZUK_READER_BASE_URL || 'https://r.jina.ai' }}
          JINA_API_KEY: ${{ secrets.LEILA_JINA_API_KEY }}
        run: python run.py
