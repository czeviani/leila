name: Leila Scraper

on:
  schedule:
    # Todos os dias às 07h e 19h BRT. Freshness importa para disponibilidade.
    - cron: '0 10,22 * * *'
  workflow_dispatch:
    # Disparo manual via GitHub UI ou API

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.LEILA_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.LEILA_SUPABASE_SERVICE_KEY }}
          PROXY_ROTATION: 'true'
          PROXY_LIST: ${{ secrets.LEILA_PROXY_LIST }}
          SCRAPER_UFS: ${{ vars.LEILA_SCRAPER_UFS || 'AC,AL,AM,AP,BA,CE,DF,ES,GO,MA,MG,MS,MT,PA,PB,PE,PI,PR,RJ,RN,RO,RR,RS,SC,SE,SP,TO' }}
        run: python run.py
